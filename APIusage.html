<body>

<h1>My Dota 2 Account</h1>

<button onclick="getStats()">Show Stats</button>

<h2 id="nickname"></h2>

<p id="rank"></p>

<p id="wins"></p>

<p id="losses"></p>

<p id="winrate"></p>

<script>

function getStats() {

    fetch("https://api.opendota.com/api/players/374636872")
        .then(response => response.json()).then(data => {document.getElementById("nickname").innerText ="Nickname: " + data.profile.personaname;
                                                         
        document.getElementById("rank").innerText ="Rank Tier: " + data.rank_tier;});

    
    fetch("https://api.opendota.com/api/players/374636872/wl")
        .then(response => response.json())
            
        .then(data => {document.getElementById("wins").innerText ="Wins: " + data.win;
                       
        document.getElementById("losses").innerText ="Losses: " + data.lose;
    
            let wr = (data.win / (data.win + data.lose) * 100).toFixed(1);
    
            document.getElementById("winrate").innerText ="Winrate: " + wr + "%";});

}

</script>
